  "/2.0/contact":
    get:
      operationId: v2ListContacts
      summary: Fetch a list of contacts
      tags:
        - Contacts
      description: This action fetches a list of all contacts
      parameters:
        - name: order_by
          in: query
          schema:
            type: string
            default: id
            enum:
              - id
              - nr
              - name_1
              - updated_at
          description: "Defines the order of the results. Multiple sort parameters can be combined by using a comma separator. `_asc` and `_desc` can be appended to any parameter to either sort ascending (default) or descending."
        - name: limit
          in: query
          schema:
            type: integer
            format: int32
            default: 500
          description: "Limit the number of results (max is 2000)"
        - name: offset
          in: query
          schema:
            type: integer
            format: int32
            default: 0
          description: Skip over a number of elements by specifying an offset value for the query
        - name: show_archived
          in: query
          schema:
            type: boolean
            default: false
          description: Show archived elements only
      responses:
        200:
          description: OK
          content:
            "application/json":
              example:
                - id: 4
                  nr: null
                  contact_type_id: 1
                  name_1: Example Company
                  name_2: null
                  salutation_id: 2
                  salutation_form: null
                  title_id: null
                  birthday: null
                  address: Smith Street 22
                  street_name: Smith Street
                  house_number: "77"
                  address_addition: Building C
                  postcode: "8004"
                  city: Zurich
                  country_id: 1
                  mail: "contact@example.org"
                  mail_second: ""
                  phone_fixed: ""
                  phone_fixed_second: ""
                  phone_mobile: ""
                  fax: ""
                  url: ""
                  skype_name: ""
                  remarks: ""
                  language_id: null
                  is_lead: false
                  contact_group_ids: "1,2"
                  contact_branch_ids: null
                  user_id: 1
                  owner_id: 1
                  updated_at: "2019-04-08 13:17:32"
    post:
      operationId: v2CreateContact
      summary: Create contact
      tags:
        - Contacts
      description: This action creates a new contact
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              type: object
              properties:
                nr:
                  type: string
                  nullable: true
                  description: "If set to null, the number will be assigned automatically. Must be a number, can also be used as integer"
                contact_type_id:
                  type: integer
                  description: "Please use the value `1` for companies or `2` for persons"
                name_1:
                  type: string
                  description: "This field is used as the company name if the field `contact_type_id` is set to `1`. Otherwise, the field is used as the last name of the person"
                name_2:
                  type: string
                  nullable: true
                  description: "This field is used as the company addition if the field `contact_type_id` is set to `1`. Otherwise, the field is used as the first name of the person"
                salutation_id:
                  type: integer
                  nullable: true
                  description: References a salutation object
                salutation_form:
                  type: integer
                  nullable: true
                title_id:
                  type: integer
                  nullable: true
                  description: References a title object
                birthday:
                  type: string
                  nullable: true
                  format: date
                street_name:
                  type: string
                  nullable: true
                  description: "Is required if `house_number` or `address_addition` are not NULL"
                house_number:
                  type: string
                  nullable: true
                  description: "Requires `street_name` if the value is not NULL"
                address_addition:
                  type: string
                  nullable: true
                  description: "Requires `street_name` if the value is not NULL"
                postcode:
                  type: string
                  nullable: true
                city:
                  type: string
                  nullable: true
                country_id:
                  type: integer
                  nullable: true
                  description: References a country object
                mail:
                  type: string
                  nullable: true
                mail_second:
                  type: string
                  nullable: true
                phone_fixed:
                  type: string
                  nullable: true
                phone_fixed_second:
                  type: string
                  nullable: true
                phone_mobile:
                  type: string
                  nullable: true
                fax:
                  type: string
                  nullable: true
                url:
                  type: string
                  nullable: true
                skype_name:
                  type: string
                  nullable: true
                remarks:
                  type: string
                  nullable: true
                language_id:
