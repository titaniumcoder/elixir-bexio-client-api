                    - ">="
                    - greater_equal
                    - "<"
                    - less_than
                    - "<="
                    - less_equal
                    - like
                    - not_like
                    - is_null
                    - not_null
                    - in
                    - not_in
              required:
                - field
                - value
            example:
              - field: search_field
                value: search term
                criteria: "="
      responses:
        200:
          description: OK
          content:
            "application/json":
              example:
                - id: 1
                  name: Kiribati
                  name_short: KI
                  iso3166_alpha2: KI
