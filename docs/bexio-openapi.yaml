                  description: References one ore multiple contact group objects
                contact_branch_ids:
                  type: string
                  nullable: true
                  description: References one ore multiple contact sector objects
                user_id:
                  type: integer
                  description: References a user object
                owner_id:
                  type: integer
              required:
                - contact_type_id
                - name_1
                - user_id
                - owner_id
