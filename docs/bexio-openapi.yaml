                - debit_account_id: 77
                  credit_account_id: 139
                  tax_id: 3
                  tax_account_id: 77
                  description: Payment for client Smith
                  amount: 328.25
                  currency_id: 1
                  currency_factor: 1
      responses:
        201:
          description: Created
          content:
            "application/json":
              example:
                id: 1
                type: manual_single_entry
                date: "2019-11-17"
                reference_nr: "Booking BA-22"
                created_by_user_id: 1
                edited_by_user_id: 1
                entries:
