      requestBody:
        required: true
        content:
          "application/json":
            schema:
              type: object
              properties:
                type:
                  type: string
                  enum:
                    - manual_single_entry
                    - manual_compound_entry
                    - manual_group_entry
                  description: "Choose one of the following three types:\nmanual_single_entry\nCan be used to create a simple one line booking such as:\ndebit account\ncredit account\namount\n1020\n3200\n13600\nmanual_compound_entry\nCan be used to create a more complex booking where the total amount can be distributed among multiple accounts.\nThe following example shows how a received bank transaction can be booked on multiple accounts:\ndebit account\ncredit account\namount\n1020\n25000\n3200\n10000\n3201\n8000\n3202\n7000\nmanual_group_entry\nCan be used to create multiple one line bookings in one group entry. This means that the bookings will have the same `reference_nr` but can differ in accounts, currencies, etc.\nThe following example shows how two received bank transaction can be booked on different accounts:\ndebit account\ncredit account\namount\n1020\n3200\n13600\n1021\n3201\n7230"
                date:
                  type: string
                  format: date
                  description: the booking date
                reference_nr:
                  type: string
                  description: A reference number for the booking
                entries:
                  type: array
                  items:
                    type: object
              required:
                - type
                - date
                - entries
            example:
              type: manual_single_entry
