  "/4.0/purchase/bills":
    get:
      operationId: ApiBillsList_GET
      summary: Get Bills
      tags:
        - Bills
      description: Endpoint for retrieving Bills
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            default: 100
          description: "Limit the number of results (max is 500)"
        - name: page
          in: query
          schema:
            type: integer
            default: 1
          description: current page
        - name: order
          in: query
          schema:
            type: string
            default: asc
          description: sorting order
        - name: sort
          in: query
          schema:
            type: string
          description: field to sort by
        - name: search_term
          in: query
          schema:
            type: string
          description: "term for which application will look for (minimum 3 signs, maximum 255 signs)"
        - name: "fields[]"
          in: query
          schema:
            type: string
            enum:
              - firstname_suffix
              - lastname_company
              - vendor_ref
              - currency_code
              - document_no
              - title
          description: "fields for which search will be run (if no 'fields[]' is specified than searching will be done for all allowed fields)"
        - name: status
          in: query
          schema:
            type: string
            enum:
              - DRAFTS
              - TODO
              - PAID
              - OVERDUE
          description: "filter for Bill 'status' (DRAFTS: [DRAFT], TODO: [BOOKED, PARTIALLY_CREATED, CREATED, PARTIALLY_SENT, SENT, PARTIALLY_DOWNLOADED, DOWNLOADED, PARTIALLY_PAID, PARTIALLY_FAILED, FAILED], PAID: [PAID], OVERDUE: [BOOKED, PARTIALLY_CREATED, CREATED, PARTIALLY_SENT, SENT, PARTIALLY_DOWNLOADED, DOWNLOADED, PARTIALLY_PAID, PARTIALLY_FAILED, FAILED]) and for 'onlyOverdue' (DRAFTS: [FALSE], TODOS: [FALSE], PAID: [FALSE], OVERDUE: [TRUE]). Choosing OVERDUE means that only Bills with 'due_date' before now will be shown"
        - name: bill_date_start
          in: query
          schema:
            type: string
            format: date
          description: "filter for Bill 'bill_date', the earliest accepted date"
        - name: bill_date_end
          in: query
          schema:
            type: string
            format: date
          description: "filter for Bill 'bill_date', the latest accepted date"
        - name: due_date_start
          in: query
          schema:
            type: string
            format: date
          description: "filter for Bill 'due_date', the earliest accepted date"
        - name: due_date_end
          in: query
          schema:
            type: string
            format: date
          description: "filter for Bill 'due_date', the latest accepted date"
        - name: vendor_ref
          in: query
          schema:
            type: string
          description: "filter for Bill 'vendor_ref', text containing in field"
        - name: title
          in: query
          schema:
            type: string
          description: "filter for Bill 'title', text containing in field"
        - name: currency_code
          in: query
          schema:
            type: string
          description: "filter for Bill 'currency_code', text containing in field"
        - name: pending_amount_min
          in: query
          schema:
            type: number
            format: double
          description: "filter for Bill 'pending_amount', the lowest accepted value"
        - name: pending_amount_max
          in: query
          schema:
            type: number
            format: double
          description: "filter for Bill 'pending_amount', the greatest accepted value"
        - name: vendor
          in: query
          schema:
            type: string
          description: "filter for Bill 'vendor', text containing in fields lastname_company and firstname_suffix"
        - name: gross_min
          in: query
          schema:
            type: number
            format: double
          description: "filter for Bill 'gross', the lowest accepted value"
        - name: gross_max
          in: query
          schema:
            type: number
            format: double
          description: "filter for Bill 'gross', the greatest accepted value"
        - name: net_min
          in: query
          schema:
            type: number
            format: double
          description: "filter for Bill 'net', the lowest accepted value"
        - name: net_max
          in: query
          schema:
            type: number
            format: double
          description: "filter for Bill 'net', the greatest accepted value"
        - name: document_no
          in: query
          schema:
            type: string
          description: "filter for Bill 'document_no', text containing in field"
        - name: supplier_id
          in: query
          schema:
            type: integer
          description: "filter for Bill 'supplier_id'"
        - name: average_exchange_rate_enabled
          in: query
          schema:
            type: boolean
          description: "indicates whether 'average_exchange_rate_enabled' is enabled, or not"
      responses:
        200:
          description: Bill retrieved
          content:
            "application/json":
              example:
                data:
                  - id: "2af7df09-bf6b-4a6b-840f-142e337e692a"
                    created_at: "2019-03-23T09:53:49+0000"
                    document_no: "NO-1"
                    status: DRAFT
                    vendor_ref: Vendor 1
                    firstname_suffix: John
                    lastname_company: Doe
                    vendor: John Doe
                    title: Title 1
                    currency_code: CHF
                    pending_amount: 100.23
                    net: 0.45
                    gross: 13.42
                    bill_date: "2019-02-12"
                    due_date: "2019-03-14"
                    overdue: false
                    booking_account_ids:
                      - 10
                      - 12
                    attachment_ids:
                      - "1cb712f3-652c-4707-9641-2de94f77e07d"
                      - "ab2b0d50-f3b0-4773-9c65-6606657db25b"
                      - "34ef8407-094a-419f-b649-789d36b5d145"
                  - id: "99fd6dc2-09cf-4db6-8dfa-2b9b3b9394b1"
                    created_at: "2019-05-23T09:53:49+0000"
                    document_no: "NO-3"
                    status: BOOKED
                    vendor_ref: Vendor 2
                    firstname_suffix: James
                    lastname_company: Doe
                    vendor: James Doe
                    title: Title 2
                    currency_code: USD
                    pending_amount: 2.73
                    net: 0.01
                    gross: 1.42
                    bill_date: "2019-04-02"
                    due_date: "2019-05-27"
                    overdue: true
                    booking_account_ids:
                      - 12
                      - 134
                      - 9
                    attachment_ids:
                      - "1f1ef73d-6b4a-4de5-812c-27f8732be88b"
                      - "d9d3a328-8c0b-4889-9b15-d3e9abc24df0"
                paging:
                  page: 1
                  page_size: 10
                  page_count: 50
                  item_count: 300
        400:
          description: Bad request
        401:
          description: Access token is missing or is invalid
        403:
          description: No access rights
    post:
      operationId: ApiBills_POST
      summary: Create new Bill
      tags:
        - Bills
      description: Endpoint for creating Bill
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              type: object
              properties:
                supplier_id:
                  type: integer
                  format: int32
                vendor_ref:
                  type: string
                title:
                  type: string
                contact_partner_id:
                  type: integer
                  format: int32
                bill_date:
                  type: string
                  format: date
                due_date:
                  type: string
                  format: date
                amount_man:
                  type: number
                  format: double
                  description: "Required when 'manual_amount' is true. Maximum of 17 digits and maximum of 2 decimal digits."
                amount_calc:
                  type: number
                  format: double
                  description: "Required when 'manual_amount' is false. Maximum of 17 digits and maximum of 2 decimal digits."
                manual_amount:
                  type: boolean
                  description: "indicates whether 'amount_man' or 'amount_calc' is required and considered as bill amount"
                currency_code:
                  type: string
                exchange_rate:
                  type: number
                  format: double
                  description: "Required when 'currency_code' is different from 'base_currency_code' (taken from settings). Maximum of 5 digits and maximum of 10 decimal digits."
                base_currency_amount:
                  type: number
                  format: double
                  description: "Required when 'currency_code' is different from 'base_currency_code' (taken from settings). Maximum of 17 digits and maximum of 2 decimal digits."
                item_net:
                  type: boolean
                  description: "Indicates whether 'amount' in 'line_items' is net or gross."
                purchase_order_id:
                  type: integer
                  format: int32
                qr_bill_information:
                  type: string
                attachment_ids:
                  type: array
                  items:
                    type: string
                address:
                  type: object
                  description: Address
                line_items:
                  type: array
                  items:
                    type: object
                  minItems: 1
                  maxItems: 100
                discounts:
                  type: array
                  items:
                    type: object
                  maxItems: 100
                payment:
                  type: object
              required:
                - supplier_id
                - contact_partner_id
                - bill_date
                - due_date
                - manual_amount
                - currency_code
                - item_net
                - attachment_ids
                - address
                - line_items
                - discounts
            example:
              supplier_id: 1323
              vendor_ref: Reference text
              title: Bill 42
              contact_partner_id: 647
              bill_date: "2019-02-12"
              due_date: "2019-03-14"
              amount_man: 23.8
              amount_calc: 32.08
              manual_amount: true
              currency_code: CHF
              exchange_rate: 2.3455347621
              base_currency_amount: 212.78
              item_net: false
              purchase_order_id: 637
              qr_bill_information: "//S1/10/10201409/11/190512/20/1400.000-53/30/106017086/31/180508/32/7.7/40/2:10;0:30"
              address:
                title: Dr.
                salutation: Mr
                firstname_suffix: John
                lastname_company: Newman
                address_line: Mega Street
                postcode: "6694"
                city: Tel Aviv
                country_code: CH
                main_contact_id: 45
                contact_address_id: 827
                type: PRIVATE
              line_items:
                - position: 0
