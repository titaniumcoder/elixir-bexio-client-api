        - Calendar Years
      description: This action fetches a list of all calendar years
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            format: int32
            default: 500
          description: "Limit the number of results (max is 2000)"
        - name: offset
          in: query
          schema:
            type: integer
            format: int32
            default: 0
          description: Skip over a number of elements by specifying an offset value for the query
      responses:
        200:
          description: OK
          content:
            "application/json":
              example:
                - id: 1
                  start: "2018-01-01"
                  end: "2018-12-31"
                  is_vat_subject: true
                  is_annual_reporting: false
                  created_at: "2017-04-28T19:58:58+00:00"
                  updated_at: "2018-04-30T19:58:58+00:00"
                  vat_accounting_method: effective
                  vat_accounting_type: agreed
    post:
      operationId: CreateCalendarYear
      summary: Create calendar year.
      tags:
        - Calendar Years
      description: This action creates a calendar year. If only year parameter is passed to request the next year is created with the same settings as the year before other way all parameters must be pass to request.
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              type: object
              properties:
                year:
                  type: string
                  description: "The year for which we want to create an entry. It is possible to create years 10 years ahead and higher than 2016 year. If it is a future year, we generate all in between with the settings the user has chosen."
                is_vat_subject:
                  type: boolean
                  description: Determines if the calendar year is vat subjected or not.
                is_annual_reporting:
                  type: boolean
                  description: Determines if the calendar year has annual reporting enabled.
                vat_accounting_method:
                  type: string
                  enum:
                    - effective
                    - net_tax
                  description: Vat accounting method.
                vat_accounting_type:
                  type: string
                  enum:
                    - agreed
                    - collected
                  description: Vat accounting type.
                default_tax_income_id:
                  type: integer
                  description: Determine default tax ID for income. References a tax object
                default_tax_expense_id:
                  type: integer
                  description: "Determine default tax ID for expense. Tax ID is not required if the client has the plan bexio mini. In this case, the year is created with the tax ID from the previous year. References a tax object."
            example:
              year: "2018"
              is_vat_subject: true
              is_annual_reporting: false
              vat_accounting_method: effective
              vat_accounting_type: agreed
              default_tax_income_id: 1
              default_tax_expense_id: 2
      responses:
        201:
          description: OK
          content:
            "application/json":
              example:
                - id: 1
                  start: "2018-01-01"
                  end: "2018-12-31"
                  is_vat_subject: true
                  is_annual_reporting: false
                  created_at: "2017-04-28T19:58:58+00:00"
                  updated_at: "2018-04-30T19:58:58+00:00"
                  vat_accounting_method: effective
                  vat_accounting_type: agreed
        422:
          description: Validation error
