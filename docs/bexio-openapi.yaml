  "/2.0/contact/search":
    post:
      operationId: v2SearchContact
      summary: Search contacts
      tags:
        - Contacts
      description: "Search contacts via query. Please refer to the Search section for detailed instructions.\nThe following search fields are supported:\n- `id`\n- `name_1`\n- `name_2`\n- `nr`\n- `address`\n- `mail`\n- `mail_second`\n- `postcode`\n- `city`\n- `country_id`\n- `contact_group_ids`\n- `contact_type_id`\n- `updated_at`\n- `user_id`\n- `phone_fixed`\n- `phone_mobile`\n- `fax`"
      parameters:
        - name: order_by
          in: query
          schema:
            type: string
            default: id
            enum:
              - id
              - nr
              - name_1
              - updated_at
          description: "Defines the order of the results. Multiple sort parameters can be combined by using a comma separator. `_asc` and `_desc` can be appended to any parameter to either sort ascending (default) or descending."
        - name: limit
          in: query
          schema:
            type: integer
            format: int32
            default: 500
          description: "Limit the number of results (max is 2000)"
        - name: offset
          in: query
          schema:
            type: integer
            format: int32
            default: 0
          description: Skip over a number of elements by specifying an offset value for the query
        - name: show_archived
          in: query
          schema:
            type: boolean
            default: false
          description: Show archived elements only
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              type: object
              properties:
                field:
                  type: string
                  description: Field which should be search over
                value:
                  type: string
                  description: Value to search for
                criteria:
                  type: string
                  default: like
                  enum:
                    - "="
                    - equal
                    - "!="
                    - not_equal
                    - ">"
                    - greater_than
                    - ">="
                    - greater_equal
                    - "<"
                    - less_than
                    - "<="
                    - less_equal
                    - like
                    - not_like
                    - is_null
                    - not_null
                    - in
                    - not_in
              required:
                - field
                - value
            example:
              - field: search_field
                value: search term
                criteria: "="
      responses:
        200:
          description: OK
          content:
            "application/json":
              example:
                - id: 4
                  nr: null
                  contact_type_id: 1
                  name_1: Example Company
                  name_2: null
                  salutation_id: 2
                  salutation_form: null
                  title_id: null
