      description: "Search orders via query. Please refer to the Search section for detailed instructions.\nThe following search fields are supported:\n- `id`\n- `kb_item_status_id`\n- `document_nr`\n- `title`\n- `contact_id`\n- `contact_sub_id`\n- `user_id`\n- `currency_id`\n- `total_gross`\n- `total_net`\n- `total`\n- `is_valid_from`\n- `is_valid_to`\n- `updated_at`"
