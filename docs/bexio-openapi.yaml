      requestBody:
        required: true
        content:
          "application/json":
            schema:
              type: object
              properties:
                field:
                  type: string
                  description: Field which should be search over
                value:
                  type: string
                  description: Value to search for
                criteria:
                  type: string
                  default: like
                  enum:
                    - "="
                    - equal
                    - "!="
                    - not_equal
                    - ">"
                    - greater_than
                    - ">="
                    - greater_equal
                    - "<"
                    - less_than
