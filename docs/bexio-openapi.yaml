  "/4.0/expenses/{id}/bookings/{status}":
    put:
      operationId: ApiExpenseBookings_PUT
      summary: Update Expense status
      tags:
        - Expenses
      description: "Changing status from DRAFT to DONE\nWhen changing status to DONE there are specific validations triggered:\n- 'bank_account_id' is required.\n- 'base_currency_amount' is required when 'curency_code' does not equal 'base_currency_code' and must be greater than 0.\n- 'booking_account_id' is required. And this Booking Account:\n- Cannot be a system asset account (account type ID 3, is_locked true)\n- Cannot be a system liability account (account type ID 4, is_locked true)\n- Cannot be a system complete account (account type ID 5, is_locked true)\n- 'document_no' cannot be blank and must be unique across all existing Expenses in DONE status.\n- 'exchange_rate' is required when 'curency_code' does not equal 'base_currency_code' and must be greater than 0.\n- 'amount' must be greater than 0.\n- 'tax_id' validation:\n- when Expense is not subject to Vat then 'tax_id' must be null\n- Tax cannot have 'digit' set to one of:\n- 415\n- 420\n- when Expense's Calendar Year has Effective Vat accounting method then Tax type must be one of:\n- pre_tax_material\n- pre_tax_investment\n- pre_customs_tax_investment\n- pre_customs_tax_material\n- pre_regards_tax_material\n- pre_regards_tax_investment\n- when Expense's Calendar Year does not have Effective Vat accounting method then 'tax_id' is not required\n- when Expense's Calendar Year does not have Effective Vat accounting method then Tax type must be one of:\n- pre_regards_tax_material\n- pre_regards_tax_investment\n- 'paid_on' must be in existing Business Year that is not Closed and not Locked.\n- If 'supplier_id' is set then 'address' cannot be null.\n- If 'aupplier_id' is not set then 'address' must be null.\n- If 'address' is set then 'address.lastname_company' cannot be null or empty\nChanging status from DONE to DRAFT\nWhen changing status to DRAFT there are specific validations triggered:\n- 'paid_on' date must be in existing Business Year that is not Closed and not Locked.\n- Expense cannot be linked to an Invoice ('invoice_id' must be null).\n- Expense cannot be reconciled with any Transaction ('transaction_id' must be null)."
      parameters:
        - name: id
          in: path
          schema:
            type: string
          required: true
          description: Id of Expense to update
        - name: status
          in: path
          schema:
            type: string
            enum:
              - DRAFT
              - DONE
          required: true
          description: Expense status to update to
      responses:
        200:
          description: Successful Expense update
          content:
            "application/json":
              example:
                id: "1355499f-aa07-4382-887e-acaf0323e6f6"
                document_no: "123"
                title: Some Title
                status: DRAFT
                firstname_suffix: Less
                lastname_company: Organisation
                created_at: "2019-03-23T09:53:49+0000"
                supplier_id: 1
                paid_on: "2019-03-20"
                bank_account_id: 3
                booking_account_id: 4
                currency_code: CHF
                base_currency_code: USD
                exchange_rate: 1.4355684751
                amount: 30.9
                tax_man: 1.14
                tax_calc: 3.45
                tax_id: 6
                base_currency_amount: 24.84
                transaction_id: "b4229af3-a20f-4f68-b513-db651dd2c2ea"
                invoice_id: "9d47155f-eac4-491e-96d0-8e187c5a7ab6"
                project_id: "1a1864c0-ba80-46a8-ad89-ffd128db9456"
                attachment_ids:
