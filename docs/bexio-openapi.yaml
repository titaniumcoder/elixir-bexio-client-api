        - name: order_by
          in: query
          schema:
            type: string
            default: id
            enum:
              - id
              - total
              - total_net
              - total_gross
              - updated_at
          description: "Defines the order of the results. Multiple sort parameters can be combined by using a comma separator. `_asc` and `_desc` can be appended to any parameter to either sort ascending (default) or descending."
        - name: limit
          in: query
          schema:
            type: integer
            format: int32
            default: 500
          description: "Limit the number of results (max is 2000)"
        - name: offset
          in: query
          schema:
            type: integer
            format: int32
            default: 0
          description: Skip over a number of elements by specifying an offset value for the query
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              type: object
              properties:
                field:
                  type: string
                  description: Field which should be search over
                value:
                  type: string
                  description: Value to search for
                criteria:
                  type: string
                  default: like
                  enum:
                    - "="
                    - equal
                    - "!="
                    - not_equal
                    - ">"
                    - greater_than
                    - ">="
                    - greater_equal
                    - "<"
                    - less_than
                    - "<="
                    - less_equal
                    - like
                    - not_like
                    - is_null
                    - not_null
                    - in
                    - not_in
              required:
                - field
                - value
            example:
              - field: search_field
                value: search term
                criteria: "="
